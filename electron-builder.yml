appId: app.wansan.studio
productName: Wansan Studio
directories:
  output: dist_electron
  buildResources: resources

files:
  - "dist/**/*"
  - "package.json"
  - "node_modules/**/*"
  - "!**/*.map"


# [CRITICAL] Unpack Native modules to avoid ASAR issues
asarUnpack:
  - "node_modules/@duckdb/**/*"

mac:
  target: dmg
  icon: resources/icon.icns
  hardenedRuntime: true
  identity: null
  gatekeeperAssess: false
  category: public.app-category.business

win:
  target:
    - nsis
    - portable  # [ADD THIS] Generates a standalone .exe
  icon: resources/icon.ico
  requestedExecutionLevel: requireAdministrator

nsis:
  oneClick: false
  perMachine: false # Install to AppData (No Admin rights needed)
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true

linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
